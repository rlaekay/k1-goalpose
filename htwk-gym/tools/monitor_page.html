<!doctype html>
<meta charset="utf-8">
<title>K1 학습 모니터</title>
<style>
:root{--bg:#0e1116;--fg:#e6edf3;--dim:#8b949e;--line:#21262d;--card:#161b22;
      --ok:#3fb950;--warn:#d29922;--bad:#f85149;--info:#58a6ff;--acc:#bc8cff}
@media(prefers-color-scheme:light){:root{--bg:#fff;--fg:#1f2328;--dim:#656d76;
      --line:#d0d7de;--card:#f6f8fa;--ok:#1a7f37;--warn:#9a6700;--bad:#cf222e;
      --info:#0969da;--acc:#8250df}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);z-index:2}
h1{font-size:15px;margin:0;font-weight:600}
#stamp{color:var(--dim)}
#hist{color:var(--dim);cursor:pointer;user-select:none}
.old{opacity:.55}
#stale{color:var(--bad)}
.card{cursor:pointer}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:9;overflow:auto;padding:24px}
#ov.on{display:block}
#ovc{max-width:1000px;margin:0 auto;background:var(--bg);border:1px solid var(--line);
     border-radius:10px;padding:20px}
#ovc h2{margin:0 0 2px;font-size:16px}
#ovx{float:right;cursor:pointer;color:var(--dim);font-size:18px;line-height:1}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:12px 0}
.kpi>div{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--card)}
.kpi b{display:block;font-size:18px;font-weight:600}
.kpi span{color:var(--dim);font-size:11px}
.big{height:190px !important}
h3{font-size:13px;margin:16px 0 4px;color:var(--dim);font-weight:600}
#tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.tab{padding:3px 10px;border:1px solid var(--line);border-radius:99px;cursor:pointer;color:var(--dim)}
.tab.on{color:var(--fg);border-color:var(--acc);background:var(--card)}
main{padding:12px 16px;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(430px,1fr))}
.card{border:1px solid var(--line);border-radius:8px;background:var(--card);padding:12px;overflow:hidden}
.row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph{font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.training{color:var(--ok)}.stalled{color:var(--bad)}.done{color:var(--info)}
.evaluating{color:var(--warn)}.evaluated{color:var(--acc)}.empty{color:var(--dim)}
.starting{color:var(--warn)}
.meta{color:var(--dim);font-size:12px;margin:4px 0 8px}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;background:var(--ok)}
canvas{width:100%;height:110px;display:block;margin-top:6px}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}
td,th{text-align:right;padding:2px 4px;border-top:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--dim);font-weight:400}
.pass{color:var(--ok)}.fail{color:var(--bad)}
#empty{color:var(--dim);padding:24px 16px}
select{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:1px 4px;font:inherit}
</style>
<header>
  <h1>K1 학습 모니터</h1>
  <span id="stamp">…</span>
  <label id="hist"><input type="checkbox" id="showold"> 이전 실행도</label>
  <div id="tabs"></div>
</header>
<main id="grid"></main>
<div id="ov"><div id="ovc"><span id="ovx">✕</span><div id="ovb"></div></div></div>
<div id="empty" hidden>logs/ 아래에 run이 없다. <code>python tools/monitor.py --once</code> 를 htwk-gym 에서 먼저 실행할 것.</div>
<script>
const $=(s,r=document)=>r.querySelector(s);
let filter=null, cache={}, tagSel={};

const hms=s=>s==null?'-':`${s/3600|0}:${String(s%3600/60|0).padStart(2,'0')}:${String(s%60|0).padStart(2,'0')}`;
const ago=s=>s==null?'-':s<90?`${s|0}초 전`:s<5400?`${s/60|0}분 전`:`${(s/3600).toFixed(1)}시간 전`;

function draw(cv,pts){
  const d=cv.getContext('2d'), w=cv.width=cv.clientWidth*devicePixelRatio, h=cv.height=110*devicePixelRatio;
  d.clearRect(0,0,w,h); if(!pts||pts.length<2)return;
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs); let y0=Math.min(...ys),y1=Math.max(...ys);
  if(y1===y0){y1+=1;y0-=1}
  const pad=8*devicePixelRatio;
  const X=v=>pad+(v-x0)/(x1-x0||1)*(w-2*pad), Y=v=>h-pad-(v-y0)/(y1-y0)*(h-2*pad);
  const cs=getComputedStyle(document.documentElement);
  d.strokeStyle=cs.getPropertyValue('--line');d.lineWidth=devicePixelRatio;
  d.beginPath();d.moveTo(pad,Y(y0));d.lineTo(w-pad,Y(y0));d.stroke();
  d.strokeStyle=cs.getPropertyValue('--info');d.lineWidth=1.6*devicePixelRatio;
  d.beginPath();pts.forEach((p,i)=>i?d.lineTo(X(p[0]),Y(p[1])):d.moveTo(X(p[0]),Y(p[1])));d.stroke();
  d.fillStyle=cs.getPropertyValue('--dim');d.font=`${10*devicePixelRatio}px ui-monospace,monospace`;
  d.fillText(y1.toPrecision(4),pad,pad+9*devicePixelRatio);
  d.textAlign='right';d.fillText(y0.toPrecision(4),w-pad,h-pad-2*devicePixelRatio);
}

function evalTable(evals,n){
  if(!evals||!evals.length)return '';
  const rows=evals.slice(-(n||4)).map(e=>{
    const g=e.gates_pass===true?'<span class="pass">PASS</span>'
          :e.gates_pass===false?'<span class="fail">FAIL</span>':'-';
    const cm=v=>v==null?'-':(v*100).toFixed(2);
    return `<tr><td>${e.checkpoint||'-'}</td><td>${cm(e.pos_median)}</td><td>${cm(e.pos_p90)}</td>
            <td>${e.heading_median==null?'-':e.heading_median.toFixed(1)}</td>
            <td>${e.falls??'-'}</td><td>${e.strict==null?'-':(e.strict*100).toFixed(1)}</td><td>${g}</td></tr>`}).join('');
  return `<table><tr><th>ckpt</th><th>pos med<br>cm</th><th>p90<br>cm</th><th>hd °</th><th>falls</th><th>strict %</th><th>게이트</th></tr>${rows}</table>`;
}

async function detail(slug,card){
  if(!cache[slug]) cache[slug]=await (await fetch(`data/${slug}.json`,{cache:'no-store'})).json();
  const r=cache[slug], tags=Object.keys(r.scalars||{}).sort();
  const host=$('.detail',card); if(!host)return;
  if(tags.length){
    const cur=tagSel[slug]||(tags.includes('reward')?'reward':tags[0]);
    tagSel[slug]=cur;
    host.innerHTML=`<div class="row"><span class="meta">그래프</span>
      <select>${tags.map(t=>`<option${t===cur?' selected':''}>${t}</option>`).join('')}</select></div>
      <canvas></canvas>${evalTable(r.evals)}`;
    const sel=host.querySelector('select');
    sel.onchange=()=>{tagSel[slug]=sel.value;draw(host.querySelector('canvas'),r.scalars[sel.value])};
    draw(host.querySelector('canvas'),r.scalars[cur]);
  }else{
    host.innerHTML=`<div class="meta">scalars.jsonl 없음 — 이 run은 기록 추가 이전이다. 진행/평가만 표시된다.</div>${evalTable(r.evals)}`;
  }
}

function kpi(v,unit,label,good){
  const t=v==null?'-':(typeof v==='number'?v.toFixed(unit==='cm'?2:unit==='%'?1:2):v);
  const cls=good===undefined?'':good?'pass':'fail';
  return `<div><b class="${cls}">${t}<span style="font-size:11px">${v==null?'':unit}</span></b><span>${label}</span></div>`;
}

async function open_detail(slug){
  const r=cache[slug]||await (await fetch(`data/${slug}.json`,{cache:'no-store'})).json();
  cache[slug]=r;
  const e=(r.evals&&r.evals.length)?r.evals[r.evals.length-1]:null;
  const tags=Object.keys(r.scalars||{}).sort();
  const cur=tagSel['ov'+slug]||(tags.includes('watch/pos_median')?'watch/pos_median':
             tags.includes('reward')?'reward':tags[0]);
  tagSel['ov'+slug]=cur;
  $('#ovb').innerHTML=`
    <h2>${r.desc} <span class="ph ${r.phase}" style="font-size:11px">${r.phase}</span></h2>
    <div class="meta">${r.started_str||''} 시작 · ${r.task} · ${r.run}</div>
    <div class="meta">warm start ${r.warm_start||'없음'}${r.best?' · best '+r.best.split('/').pop():''}${r.stopped?' · <span class="fail">STOP: '+r.stopped+'</span>':''}</div>
    <div class="kpi">
      ${kpi(e&&e.pos_median!=null?e.pos_median*100:null,'cm','위치 median (기준 2.72)',e&&e.pos_median!=null?e.pos_median<=0.05:undefined)}
      ${kpi(e&&e.pos_p90!=null?e.pos_p90*100:null,'cm','위치 p90 (기준 10)',e&&e.pos_p90!=null?e.pos_p90<=0.10:undefined)}
      ${kpi(e?e.heading_median:null,'°','heading median (기준 10)',e&&e.heading_median!=null?e.heading_median<=10:undefined)}
      ${kpi(e?e.falls:null,'','낙상 (기준 0)',e&&e.falls!=null?e.falls===0:undefined)}
      ${kpi(e&&e.strict!=null?e.strict*100:null,'%','strict 성공률',undefined)}
      ${kpi(r.iter,'','iteration')}
      ${kpi(r.s_per_iter,'s','s/iter')}
      ${kpi(r.n_ckpt,'','checkpoint 수')}
    </div>
    <h3>그래프</h3>
    <div class="row"><span class="meta">${tags.length?'':'scalars 없음'}</span>
      <select id="ovsel">${tags.map(t=>`<option${t===cur?' selected':''}>${t}</option>`).join('')}</select></div>
    <canvas class="big" id="ovcv"></canvas>
    <h3>평가 이력 (전체 ${(r.evals||[]).length}건)</h3>
    ${evalTable(r.evals,999)||'<div class="meta">아직 평가 결과가 없다. watch_eval 로그를 확인할 것: logs/watch_eval/'+r.desc+'.log</div>'}`;
  const sel=$('#ovsel');
  if(sel){sel.onchange=()=>{tagSel['ov'+slug]=sel.value;draw($('#ovcv'),r.scalars[sel.value])};
          draw($('#ovcv'),r.scalars[cur]);}
  $('#ov').classList.add('on');
}
$('#ovx').onclick=()=>$('#ov').classList.remove('on');
$('#ov').onclick=e=>{if(e.target.id==='ov')$('#ov').classList.remove('on')};
addEventListener('keydown',e=>{if(e.key==='Escape')$('#ov').classList.remove('on')});

async function tick(){
  let ix; try{ix=await (await fetch('data/index.json',{cache:'no-store'})).json()}catch(e){return}
  $('#stamp').textContent=new Date(ix.generated*1000).toLocaleTimeString()+' 갱신';
  const batches=[...new Set(ix.runs.map(r=>r.batch))].sort();
  $('#tabs').innerHTML=['전체',...batches].map(b=>{
    const k=b==='전체'?null:b;
    return `<span class="tab${filter===k?' on':''}" data-b="${b}">${b==='전체'?b:b+' 배치'}</span>`}).join('');
  $('#showold').onchange=tick;
  $('#tabs').querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
    filter=t.dataset.b==='전체'?null:t.dataset.b;tick()});
  const showOld=$('#showold').checked;
  const rows=ix.runs.filter(r=>(!filter||r.batch===filter)&&(showOld||r.latest!==false));
  const n_old=ix.runs.length-ix.runs.filter(r=>r.latest!==false).length;
  $('#hist').style.display=n_old?'':'none';
  $('#hist').lastChild.textContent=` 이전 실행 ${n_old}개도 보기`;
  $('#empty').hidden=ix.runs.length>0;
  $('#grid').innerHTML=rows.map(r=>{
    const pct=r.max_iter?Math.min(100,100*r.iter/r.max_iter):0;
    return `<div class="card${r.latest===false?' old':''}" data-slug="${r.slug}">
      <div class="row"><span class="name" title="${r.run}">${r.desc}</span>
        <span class="ph ${r.phase}">${r.phase}</span></div>
      <div class="meta">${r.started_str||''} 시작 · ${r.task} · warm start ${r.warm_start||'없음'}${r.best?' · best '+r.best.split('/').pop():''}</div>
      <div class="row"><span>${r.iter} / ${r.max_iter||'?'} iter · ckpt ${r.n_ckpt}</span>
        <span>${r.s_per_iter?r.s_per_iter.toFixed(2)+' s/it':''} ${r.eta_s?'· ETA '+hms(r.eta_s):''}</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="meta">마지막 checkpoint ${ago(r.last_ckpt_age_s)} · 평가 ${r.n_evals}건</div>
      <div class="detail"></div></div>`}).join('');
  $('#grid').querySelectorAll('.card').forEach(c=>{
    detail(c.dataset.slug,c);
    c.onclick=ev=>{if(ev.target.tagName!=='SELECT')open_detail(c.dataset.slug)};
  });
}
tick(); setInterval(tick,15000);
addEventListener('resize',()=>$('#grid').querySelectorAll('.card').forEach(c=>detail(c.dataset.slug,c)));
</script>
