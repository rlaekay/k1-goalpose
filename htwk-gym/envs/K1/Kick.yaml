# K1 kick task (v5) -- fork of envs/T1/Kicking.yaml ported to K1 (2026-07-25).
# Pairs with envs/K1/kick.py (class Kick). Train with the existing PPO stack:
#   python train_v3.py --task K1/Kick --headless True --sim_device cuda:0 --rl_device cuda:0
# T1->K1 deltas: asset/heights/gains; sim block from Goal_Pose.yaml (cuda, TGS,
# vel_iters 0); ball radius single-sourced (URDF sphere 0.075); kick target
# single-sourced via rewards.kick_target_pos_world; debug keys removed.
# No warm start: obs 44 != GoalPose's 54 (documented in MASTERPLAN).

basic:
  checkpoint: null
  headless: true
  max_iterations: 10000
  sim_device: "cuda:0"
  rl_device: "cuda:0"
  seed: 42
  description: ""
  task: "K1/Kick"

env:
  num_envs: 4096
  num_observations: 44   # gravity3 + angvel3 + ball_rel_xy2 + dofpos12 + dofvel12 + act12
  num_privileged_obs: 20
  num_actions: 12
  env_spacing: 5.

runner:
  horizon_length: 24
  mini_epochs: 5
  num_minibatches: 4
  save_interval: 100
  use_wandb: false

viewer:
  pos: [3., -3., 2.]  # [m]
  lookat: [0., 0., 0.]  # [m]
  record_video: false  # only in play
  record_interval: 5.  # [s]
  record_env_idx: 0

algorithm:
  learning_rate: 5.e-6   # adaptive-KL controller takes over from here
  gamma: 0.995
  lam: 0.95
  bound_coef: 1.0
  entropy_coef: -0.01
  desired_kl: 0.01

sim:
  dt: 0.002
  substeps: 1
  up_axis: "z"
  gravity: [0.0, 0.0, -9.81]
  physics_engine: "physx"
  physx:
    num_threads: 4
    solver_type: 1 # 0: pgs, 1: tgs
    num_position_iterations: 4
    num_velocity_iterations: 0  # TGS only needs position iterations
    contact_offset: 0.02
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 100.0
    default_buffer_size_multiplier: 5.0
    max_gpu_contact_pairs: 8388608
    num_subscenes: 4
    contact_collection: 1

asset:
  file: "resources/K1/K1_locomotion.urdf"
  name: "K1"
  base_name: "Trunk"
  foot_names: ["left_foot_link", "right_foot_link"]
  disable_gravity: false
  default_dof_drive_mode: 3
  collapse_fixed_joints: true
  fix_base_link: false
  self_collisions: 0
  replace_cylinder_with_capsule: false
  flip_visual_attachments: false
  density: 0.001
  angular_damping: 0.
  linear_damping: 0.
  max_angular_velocity: 1000.
  max_linear_velocity: 1000.
  armature: 0.
  thickness: 0.01
  feet_edge_pos: [[ 0.1215,  0.05, -0.03],
                  [ 0.1215, -0.05, -0.03],
                  [-0.1015,  0.05, -0.03],
                  [-0.1015, -0.05, -0.03]] # x,y,z [m]

ball:
  file: "resources/T1/ball.urdf"   # robot-agnostic; shared with the T1 task
  name: "ball"
  radius: 0.075                    # MUST match the URDF sphere radius
  init_pos: [0.3, 0.0, 0.075]
  init_rot: [0.0, 0.0, 0.0, 1.0]
  restitution: 0.0
  friction: 1
  rolling_friction: 1
  density: 0.001
  thickness: 0.01

init_state:
  pos: [0.0, 0.0, 0.58] # x,y,z [m]
  rot: [0.0, 0.0, 0.0, 1.0]
  lin_vel: [0.0, 0.0, 0.0]
  ang_vel: [0.0, 0.0, 0.0]
  default_joint_angles: {"Hip_Pitch": -0.2, "Knee_Pitch": 0.4, "Ankle_Pitch": -0.25, "default": 0.}

control:
  stiffness: {"Hip": 100., "Knee": 100., "Ankle": 50.} # [N*m/rad]
  damping: {"Hip": 2., "Knee": 2., "Ankle": 1.} # [N*m*s/rad]
  action_scale: 1.
  decimation: 10

terrain:
  type: "plane"
  static_friction: 1.0
  dynamic_friction: 1.0
  restitution: 0.
  # trimesh only:
  terrain_length: 10.
  terrain_width: 10.
  border_size: 5.
  num_terrains: 8
  terrain_proportions: [0.0, 0.0, 0.5, 0.5]
  slope: 0.1
  random_height: 0.1
  discrete_height: 0.02
  horizontal_scale: 0.1
  vertical_scale: 0.005
  slope_threshold: 2.0

commands:
  # unused by this task, but _init_buffers sizes the curriculum stub from these
  lin_vel_levels: 10
  ang_vel_levels: 10

normalization:
  gravity: 1.0
  lin_vel: 1.0
  ang_vel: 1.0
  dof_pos: 1.0
  dof_vel: 0.1
  filter_weight: 0.1
  push_force: 0.1
  push_torque: 0.5
  clip_actions: 1.
  ball_pos: 1.0

noise:
  gravity:
    range: [0., 0.01]
    operation: "additive"
    distribution: "gaussian"
  lin_vel:
    range: [0., 0.05]
    operation: "additive"
    distribution: "gaussian"
  ang_vel:
    range: [0., 0.1]
    operation: "additive"
    distribution: "gaussian"
  dof_pos:
    range: [0., 0.01]
    operation: "additive"
    distribution: "gaussian"
  dof_vel:
    range: [0., 0.1]
    operation: "additive"
    distribution: "gaussian"
  height:
    range: [0., 0.02]
    operation: "additive"
    distribution: "gaussian"
  ball_pos:
    range: [-0.01, 0.01]
    operation: "additive"
    distribution: "gaussian"

randomization:
  init_dof_pos:
    range: [0., 0.05]
    operation: "additive"
    distribution: "gaussian"
  init_base_lin_vel_xy:
    range: [0., 0.1]
    operation: "additive"
    distribution: "gaussian"
  init_base_ang:
    range: [-0.1, 0.1]
    operation: "additive"
    distribution: "gaussian"

  # ball spawn offset in the ROBOT'S LOCAL frame (rotated to world properly)
  ball_init_pos_x:
    range: [0.25, 0.4]
    operation: "additive"
    distribution: "uniform"
  ball_init_pos_y:
    range: [0, 0.2]
    operation: "additive"
    distribution: "uniform"

  kick_interval_s: 2.
  kick_lin_vel:
    range: [0., 0.]
    operation: "additive"
    distribution: "gaussian"
  kick_ang_vel:
    range: [0., 0.]
    operation: "additive"
    distribution: "gaussian"

  push_interval_s: 5.
  push_duration_s: 1.
  push_force:
    range: [0., 0.]
    operation: "additive"
    distribution: "gaussian"
  push_torque:
    range: [0., 0.]
    operation: "additive"
    distribution: "gaussian"

  dof_stiffness:
    range: [0.95, 1.05]
    operation: "scaling"
    distribution: "uniform"
  dof_damping:
    range: [0.95, 1.05]
    operation: "scaling"
    distribution: "uniform"
  dof_friction:
    range: [0.0, 2.0]
    operation: "additive"
    distribution: "uniform"

  friction:
    range: [0.1, 2.0]
    operation: "additive"
    distribution: "uniform"
  compliance:
    range: [0.5, 1.5]
    operation: "additive"
    distribution: "uniform"
  restitution:
    range: [0.1, 0.9]
    operation: "additive"
    distribution: "uniform"

  base_com:
    range: [-0.1, 0.1]
    operation: "additive"
    distribution: "uniform"
  base_mass:
    range: [0.8, 1.2]
    operation: "scaling"
    distribution: "uniform"
  other_com:
    range: [-0.005, 0.005]
    operation: "additive"
    distribution: "uniform"
  other_mass:
    range: [0.98, 1.02]
    operation: "scaling"
    distribution: "uniform"

rewards:
  scales:
    survival: 0.25
    tracking_lin_vel_x: 1
    tracking_lin_vel_y: 1
    tracking_ang_vel: 0.25
    base_height: -200.
    orientation: -20
    torques: -2.e-4
    torque_tiredness: -1.e-2
    power: -2.e-3
    lin_vel_z: -1.5
    ang_vel_xy: -0.1
    dof_vel: -3.e-4
    dof_acc: -1.e-7
    root_acc: -1.e-5
    action_rate: -1.5
    dof_pos_limits: -1
    feet_slip: -1
    feet_yaw_diff: -3.
    feet_yaw_mean: -3.
    feet_roll: -0.3
    ball_velocity_target_direction: 10
    kicking_foot_approach_ball_stationary: 10
    body_alignment_for_kick: 1
    body_angle: 0.1
    ball_acceleration: 0.25
    waiting: -1.0
  # scale overrides applied while the ball is moving (approach-then-follow-through)
  ball_rolling_scale:
    waiting: 0.0
    survival: 0.5
    kicking_foot_approach_ball_stationary: 0

  episode_length_s: 7.
  terminate_height: 0.35            # K1 (T1 was 0.45)
  terminate_vel: 50.
  terminate_contacts_on: []
  penalize_contacts_on: ["Trunk", "Hip", "Shank", "Ankle"]  # K1 body names (arm/head links are collapsed into Trunk)
  only_positive_rewards: false
  tracking_sigma: 0.25
  base_height_target: 0.52          # K1 (T1 was 0.68)
  soft_dof_pos_limit: 1.
  soft_dof_vel_limit: 1.
  soft_torque_limit: 1.

  # kick reward parameters -- kick_target_pos_world is the SINGLE source of the
  # target (the T1 code hardcoded [5,0,0.05] in one reward and ignored the yaml)
  kick_target_pos_world: [5.0, 0.0, 0.075]  # z = ball radius
  max_ball_vel_target_reward: 10.0
  ball_velocity_decay_time: 0.1
  ball_stationary_speed_threshold: 0.1
  approach_proximity_sigma: 0.1
  max_approach_reward: 50.0
  alignment_to_target_sigma: 0.5
  max_alignment_reward: 1.0
  ball_acceleration_scale: 80.0
  max_ball_acceleration_reward: 80.0
  kicking_foot_index: 0             # 0 left_foot_link, 1 right_foot_link

  # episode-shaping timers
  min_ball_vel_s: 2                 # sustained ball motion this long = success
  max_ball_still_time_s: 2
  max_ball_moving_time_s: 5

evaluation:
  # placeholder gates for a future eval_kick.py (tensorboard kick_success /
  # fell episode rates are the first-run metrics)
  num_envs: 256
  duration_s: 60.
