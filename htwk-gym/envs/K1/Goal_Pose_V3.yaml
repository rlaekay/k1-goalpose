# GoalPose v3 challenger config -- generated from Goal_Pose.yaml (2026-07-24) + overrides.
# Pairs with envs/K1/goal_pose_v3.py (GoalPoseV3) and utils/runner_v3.py (train_v3.py).
# On top of the armD_v2_ultimate sim2real bundle this adds, each independently switchable:
#   - success-adaptive goal curriculum  -> commands.goal_curriculum (enabled: true)
#   - Rudin-style timed task reward     -> rewards.final_window_s   (0 = off; try 2.0)
#   - L/R mirror-symmetry loss          -> algorithm.symmetry_coef  (0 = off; 0.5 default)
#   - minibatched PPO                   -> runner.num_minibatches   (rsl_rl convention)
# Base Goal_Pose.yaml and arms A-D are untouched; this file is regenerable, edit freely.
basic:
  checkpoint: null
  headless: true
  max_iterations: 20000
  sim_device: cuda:0
  rl_device: cuda:0
  seed: 42
  description: ''
  debug_feet_offset: false
  task: K1/Goal_Pose_V3
env:
  num_envs: 8192
  num_observations: 54
  num_privileged_obs: 14
  num_actions: 12
  env_spacing: 1.0
runner:
  horizon_length: 24
  mini_epochs: 5
  save_interval: 100
  use_wandb: false
  num_minibatches: 4
viewer:
  pos:
  - 3.0
  - -3.0
  - 2.0
  lookat:
  - 0.0
  - 0.0
  - 0.0
  record_video: false
  record_interval: 5.0
  record_env_idx: 0
algorithm:
  learning_rate: 5.0e-06
  gamma: 0.995
  lam: 0.95
  bound_coef: 1.0
  entropy_coef: -0.01
  symmetric_coef: 10.0
  desired_kl: 0.01
  symmetry_coef: 0.5
sim:
  dt: 0.002
  substeps: 1
  up_axis: z
  gravity:
  - 0.0
  - 0.0
  - -9.81
  physics_engine: physx
  physx:
    num_threads: 4
    solver_type: 1
    num_position_iterations: 4
    num_velocity_iterations: 0
    contact_offset: 0.02
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 100.0
    default_buffer_size_multiplier: 5.0
    max_gpu_contact_pairs: 8388608
    num_subscenes: 4
    contact_collection: 1
asset:
  file: resources/K1/K1_locomotion.urdf
  name: K1
  base_name: Trunk
  foot_names:
  - left_foot_link
  - right_foot_link
  disable_gravity: false
  default_dof_drive_mode: 3
  collapse_fixed_joints: true
  fix_base_link: false
  self_collisions: 0
  replace_cylinder_with_capsule: false
  flip_visual_attachments: false
  density: 0.001
  angular_damping: 0.0
  linear_damping: 0.0
  max_angular_velocity: 1000.0
  max_linear_velocity: 1000.0
  armature: 0.02
  thickness: 0.01
  feet_edge_pos:
